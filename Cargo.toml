[package]
name = "smartwe-network"
version = "0.1.0"
edition = "2024"
description = "SmartWe 公司内网（NetentSec 门户）上网认证工具"

[dependencies]
gpui-kit = "0.9.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# 门户 HTTP 客户端
ureq = { version = "2", default-features = false, features = ["gzip"] }

# 平台集成
keyring = { version = "3", features = ["windows-native"] }
auto-launch = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }

# 网卡信息
ipconfig = "0.3"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
